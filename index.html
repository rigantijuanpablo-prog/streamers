<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGMA | División Creadores de Contenido</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
  body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
  .popup{
    width:100%;max-width:400px;background:#111;border-radius:20px;
    overflow:hidden;border:1px solid #222;
  }
  /* LOGO ARRIBA SOLO */
  .popup-header{
    background:#fff;padding:12px;display:flex;align-items:center;justify-content:center
  }
  .popup-header img{height:42px;width:auto;object-fit:contain}
  /* FOTO COMPLETA SIN CORTAR */
  .popup-img{width:100%;height: auto}
  .popup-img img{width:100%;height:auto;display:block;object-fit:contain}
  .popup-body{padding:18px}
  .popup-body h2{color:#fff;font-size:22px;line-height:1.2;font-weight:800;margin-bottom:8px}
  .popup-body p{color:#999;font-size:13px;line-height:1.4;margin-bottom:14px}
  .popup-body p strong{color:#fff}
  .tags{display:flex;gap:6px;margin-bottom:14px}
  .tag{flex:1;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:8px;padding:8px;text-align:center;color:#fff;font-size:12px;font-weight:700}
  .tag span{color:#777;font-size:10px;display:block;font-weight:400}
  .btn{width:100%;background:#fff;color:#000;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
  .small{color:#555;font-size:10px;text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="popup">
  <div class="popup-header">
    <img src="rgame-division-creadores.jpg" alt="RGMA División Creadores de Contenido">
  </div>
  <div class="popup-img">
    <img src="foto-popup-creadores.jpg" alt="Tu canal es 100% tuyo">
  </div>
  <div class="popup-body">
    <h2>¿Te llegó un contrato y no sabés si firmar?</h2>
    <p>Tu canal es <strong>tu trabajo</strong>. Lo revisamos con vos, sin costo, para que siga siendo 100% tuyo.</p>
    <div class="tags">
      <div class="tag">✓ Gratis<span>Revisión</span></div>
      <div class="tag">✓ 24hs<span>Respuesta</span></div>
      <div class="tag">✓ 100%<span>Confidencial</span></div>
    </div>
    <button class="btn" onclick="window.open('https://wa.me/549XXXXXXXXXX?text=Hola%20RGMA%20quiero%20revisar%20mi%20contrato','_blank')">Mandar mi contrato por WhatsApp →</button>
    <div class="small">Sin compromiso. Te decimos si te conviene o no en criollo.</div>
  </div>
</div>

</body>
</html>
